name: Tests

on:
  push:
    branches:
      - 10.x-dev
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 0.x
      - 10.x
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      php-versions: '["8.1", "8.2", "8.3"]'
      laravel: 10.x
      testbench: ^8.0
      resolve-matrix: true
      quality-php: '8.2'
      node-version: 18.x
