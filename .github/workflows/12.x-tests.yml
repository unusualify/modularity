name: Tests

on:
  push:
    branches:
      - dev
      - 12.x
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - dev
      - 12.x
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      laravel: 12.x
      testbench: ^10.0
      node-version: 22.x
