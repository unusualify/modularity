name: Tests

on:
  push:
    branches:
      - 13.x-dev
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 13.x-dev
      - 13.x
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      php-versions: '["8.3", "8.4", "8.5"]'
      laravel: 13.x
      testbench: ^11.0
      resolve-matrix: true
      node-version: 22.x
