name: Tests

on:
  push:
    branches:
      - 11.x-dev
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 11.x
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      php-versions: '["8.2", "8.3", "8.4"]'
      laravel: 11.x
      testbench: ^9.0
      resolve-matrix: true
      node-version: 20.x
